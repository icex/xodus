name: Rust check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    name: Check fmt
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, icex-ci]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check --all
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: [self-hosted, linux, x64, icex-ci]
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        if: (runner.os == 'Linux') && runner.environment != 'self-hosted'
        run: sudo apt update && sudo apt install libwebkit2gtk-4.1-dev protobuf-compiler
      - name: Install protobuf
        if: ${{ runner.os == 'macOS' }}
        run: brew install protobuf
      - name: Update Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --message-format=json | python3 scripts/cargo-annotate.py "${{ matrix.target }}"

      - name: Run tests
        shell: bash
        run: |
          cargo test
